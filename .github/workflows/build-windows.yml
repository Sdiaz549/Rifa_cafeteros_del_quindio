name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - cursor/windows-installer-fe27

permissions:
  contents: read

jobs:
  dist-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build unpacked Windows app and verify Prisma layout
        run: |
          npm run dist:win:dir
          npm run verify:packaged
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''
          GITHUB_TOKEN: ''

      - name: Build NSIS Setup + portable
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''
          GITHUB_TOKEN: ''

      - name: List release outputs
        run: Get-ChildItem release -File | Select-Object Name, Length

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rifa-windows-installer
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
