name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - cursor/windows-installer-fe27

permissions:
  contents: read

jobs:
  dist-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build and package Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''
          GITHUB_TOKEN: ''

      - name: List release outputs
        run: Get-ChildItem -Recurse release | Select-Object FullName, Length

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rifa-windows-installer
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
